name: Release

# On a version tag (v1.0.0…): build the plugin zip, attach it to a GitHub release
# and, once the plugin is approved on wordpress.org and the SVN_USERNAME /
# SVN_PASSWORD secrets exist, deploy the same build to the plugin's SVN.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_SVN: ${{ secrets.SVN_USERNAME != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The write token must not sit in .git/config while composer and npm scripts run.
          persist-credentials: false

      - name: Tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(grep -E '^\s*\*\s*Version:' social-relay-for-postiz.php | awk '{print $NF}')"
          STABLE="$(grep -E '^Stable tag:' readme.txt | awk '{print $NF}')"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "Tag $TAG does not match Version $HEADER / Stable tag $STABLE" >&2
            exit 1
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Build the plugin zip
        run: bin/build-release.sh dist

      - name: Unzip for the SVN deploy
        run: unzip -q dist/social-relay-for-postiz.zip -d dist/build

      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/social-relay-for-postiz.zip
          generate_release_notes: true

      - name: Deploy to wordpress.org
        if: env.HAS_SVN == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: social-relay-for-postiz
          BUILD_DIR: dist/build/social-relay-for-postiz
          ASSETS_DIR: .wordpress-org
